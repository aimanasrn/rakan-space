# RakanSpace local development stack.
# Host ports avoid the common defaults (5432/6379) so the stack can run next
# to other local projects. Change them in .env (see .env.example) if needed.
name: rakanspace

x-backend: &backend
  build:
    context: ./src/backend
    dockerfile: Dockerfile
  image: rakanspace-backend:dev
  # Run as the host user so files written to the bind mount stay editable.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  working_dir: /var/www/html
  volumes:
    - ./src/backend:/var/www/html
  environment: &backend-env
    APP_ENV: local
    HOME: /tmp
    COMPOSER_HOME: /tmp/composer
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    REVERB_SERVER_HOST: 0.0.0.0
    # Laravel talks to Reverb inside the Docker network.
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    # artisan serve only passes the container environment through with --no-reload.
    PHP_CLI_SERVER_WORKERS: 4
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rakanspace
      POSTGRES_USER: rakanspace
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rakanspace -d rakanspace"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  backend:
    <<: *backend
    command: ["sh", "/var/www/html/docker/entrypoint.sh", "php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,notifications", "--tries=3", "--backoff=10", "--max-time=3600"]
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend:
        condition: service_healthy

  reverb:
    <<: *backend
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "127.0.0.1:${REVERB_HOST_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_HOST_PORT:-8000}
      NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:-rakanspace-key}
      NEXT_PUBLIC_REVERB_HOST: localhost
      NEXT_PUBLIC_REVERB_PORT: ${REVERB_HOST_PORT:-8080}
      NEXT_PUBLIC_REVERB_SCHEME: http
      WATCHPACK_POLLING: "true"
    volumes:
      - ./src/frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  frontend-node-modules:
  frontend-next:
